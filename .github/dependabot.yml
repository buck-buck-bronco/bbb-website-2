# Weekly version updates. Minor and patch updates are grouped into one pull
# request per directory. Major updates are left ungrouped so each ships alone.
# The group applies only to version updates, so security updates stay separate.
# Cooldown delays version updates only. Security updates bypass it.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/buck-buck-bronco-main"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Chicago"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      minor-and-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
