<!DOCTYPE html><html><head><meta charset="utf-8"><title>El Cafecito</title>
<script>
(async function(){
  const base = "https://cdn.jsdelivr.net/gh/buck-buck-bronco/bbb-website-2@main/el-cafecito-scroll/";
  const parts = await Promise.all([0,1,2].map(i => fetch(base+"part"+i+".txt").then(r=>{if(!r.ok)throw r.status;return r.text();})));
  document.open(); document.write(parts.join("")); document.close();
})().catch(e=>{document.body.textContent="Load error: "+e;});
</script></head><body style="background:#1E0E06;color:#F5EFE6;font-family:system-ui;padding:2rem">Loading…</body></html>
